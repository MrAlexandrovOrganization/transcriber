[tool.poetry]
name = "transcriber-backend"
version = "0.1.0"
description = "Shared Whisper transcription gRPC service"
authors = ["Your Name <your.email@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
grpcio = ">=1.80,<1.81"
protobuf = ">=5.0"
faster-whisper = "^1.0"
psycopg = {version = "^3.2", extras = ["binary"]}
opentelemetry-api = "^1.39"
opentelemetry-sdk = "^1.39"
opentelemetry-exporter-otlp-proto-grpc = "^1.39"
opentelemetry-instrumentation-grpc = "^0.60b0"

[tool.poetry.group.dev.dependencies]
grpcio-tools = ">=1.80,<1.81"
mypy-protobuf = "^3.6"
ruff = "^0.15.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
extend-select = ["I"]
