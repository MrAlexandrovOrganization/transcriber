syntax = "proto3";
package whisper;

option go_package = "transcriber-bot/gen/whisper";

service TranscriptionService {
  // Synchronous (legacy) — client streams audio, blocks until transcription is done.
  rpc Transcribe(stream TranscribeChunk) returns (TranscribeResponse);

  // Async — client streams audio, gets a job_id immediately.
  rpc Submit(stream TranscribeChunk) returns (SubmitResponse);

  // Poll job status and retrieve result when done.
  rpc GetStatus(StatusRequest) returns (StatusResponse);

  // Cancel a pending or running job.
  rpc Cancel(CancelRequest) returns (CancelResponse);

  // Confirm durable receipt of a terminal result or error.
  rpc Ack(AckRequest) returns (AckResponse);
}

// Optional, separately authenticated endpoint for workers outside Docker.
// Each claim has a fresh lease token; expired owners cannot publish results.
service WorkerService {
  // Report readiness independently of job leases, including while idle/busy.
  rpc ReportAvailability(WorkerAvailabilityRequest) returns (WorkerAvailabilityResponse);
  rpc Claim(WorkerClaimRequest) returns (WorkerClaimResponse);
  rpc Download(WorkerJobRequest) returns (stream WorkerAudioChunk);
  rpc Heartbeat(WorkerHeartbeatRequest) returns (WorkerAck);
  rpc Complete(WorkerCompleteRequest) returns (WorkerAck);
  rpc Fail(WorkerFailRequest) returns (WorkerAck);
  // RabbitMQ consumers obtain operator-owned priority and a bounded pool slot.
  rpc RegisterConsumer(WorkerClaimRequest) returns (WorkerConsumerResponse);
  // Start only the specific job delivered by RabbitMQ; never selects queue work.
  rpc BeginAttempt(WorkerBeginRequest) returns (WorkerBeginResponse);
}

message WorkerConsumerResponse {
  bool admitted = 1;
  int32 priority = 2; // RabbitMQ order: larger numbers win.
}

message WorkerBeginRequest {
  string worker_id = 1;
  string instance_id = 2;
  string job_id = 3;
  string message_id = 4;
  string delivery_id = 5; // Fresh UUID for this receipt; reuse on RPC retry.
}

message WorkerBeginResponse {
  // started, busy (defer delivery), or discard (terminal/stale/unknown).
  string disposition = 1;
  WorkerClaimResponse job = 2;
}

message WorkerClaimRequest {
  string worker_id = 1;
  // Matches a ready execution slot. Required when pool priorities are enabled.
  string instance_id = 2;
}

message WorkerAvailabilityRequest {
  string worker_id = 1;
  string instance_id = 2; // Fresh UUID per slot on each process start.
  bool ready = 3; // Only after the model has loaded; false on graceful stop.
}

message WorkerAvailabilityResponse {
  bool accepted = 1;
  int32 ttl_seconds = 2; // Coordinator clock determines expiry.
}

message WorkerClaimResponse {
  // Empty when no work is available.
  string job_id = 1;
  string lease_token = 2;
  int32 lease_seconds = 3;
  string format = 4;
  TranscriptionOptions options = 5;
  int64 input_size = 6;
  string traceparent = 7;
  string tracestate = 8;
}

message WorkerJobRequest {
  string job_id = 1;
  string lease_token = 2;
}

message WorkerAudioChunk {
  bytes data = 1;
}

message WorkerHeartbeatRequest {
  string job_id = 1;
  string lease_token = 2;
  float progress_percent = 3;
}

message WorkerCompleteRequest {
  string job_id = 1;
  string lease_token = 2;
  string text = 3;
  repeated Segment segments = 4;
}

message WorkerFailRequest {
  string job_id = 1;
  string lease_token = 2;
  // A stable error code; never send exception text or credentials.
  string error_code = 3;
  bool retryable = 4;
}

message WorkerAck {
  bool accepted = 1;
}

message CancelRequest {
  string job_id = 1;
}

message CancelResponse {
  bool cancelled = 1; // true if job was found and marked for cancellation
}

message AckRequest {
  string job_id = 1;
}

message AckResponse {
  bool acknowledged = 1;
}

// Transcription preset and optional overrides.
// The backend applies the named preset's default parameters, then applies
// any non-empty override fields on top.
message TranscriptionOptions {
  // Named preset: "auto", "voice", "lecture", "meeting".
  // Empty string is treated as "auto".
  string preset = 1;
  // Override language (e.g. "ru", "en"). Empty = use preset default.
  string language = 2;
  // Override the initial prompt sent to the model. Empty = use preset default.
  string initial_prompt = 3;
}

// Sent by the client one chunk at a time.
// The first chunk MUST have a non-empty format field ("ogg", "mp4", etc.).
// The first chunk MAY also carry transcription options.
message TranscribeChunk {
  bytes data = 1;
  string format = 2; // first chunk: file format ("ogg", "mp4", etc.)
  TranscriptionOptions options = 3; // first chunk: transcription options (optional)
  // First chunk only. Caller-scoped unique identity, e.g. notes-bot:<UUID>.
  // Replays must refer to the same audio bytes and options.
  string request_id = 4;
  // First chunk only. Preserve terminal result/error until explicit Ack.
  bool retain_until_ack = 5;
}

message TranscribeResponse {
  string text = 1;
}

message SubmitResponse {
  string job_id = 1;
  int32 queue_position = 2; // 1 = currently running, 2+ = waiting
}

message StatusRequest {
  string job_id = 1;
}

enum JobStatus {
  ACCEPTED = 0;
  DOWNLOADING = 1;
  QUEUED = 2;
  RUNNING = 3;
  DONE = 4;
  FAILED = 5;
}

message Segment {
  float start = 1; // start time in seconds
  float end = 2; // end time in seconds
  string text = 3; // transcribed text for this segment
}

message StatusResponse {
  string job_id = 1;
  JobStatus status = 2;
  string text = 3; // plain text (all segments joined); populated when status == DONE
  string error = 4; // populated when status == FAILED
  repeated Segment segments = 5; // timestamped segments; populated when status == DONE (preset-dependent)
  float progress_percent = 6; // best-effort progress estimate for RUNNING jobs, 0..100
  string stage = 7; // textual stage name: accepted/downloading/queued/running/done/failed
  int32 attempts = 8;
  int32 max_attempts = 9;
}
