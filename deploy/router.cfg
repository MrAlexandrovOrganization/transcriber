global
    log stdout format raw local0 warning
    maxconn 256
    nbthread 1

defaults
    mode tcp
    log global
    option dontlognull
    timeout connect 2s
    timeout check 1s
    timeout queue 1s
    timeout client 8h
    timeout server 8h
    retries 0

listen client_api
    bind :50053
    server coordinator "${COORDINATOR_ADDRESS}:50053" check inter 2s fall 2 rise 1 on-marked-down shutdown-sessions

listen worker_api
    bind :50056
    server coordinator "${COORDINATOR_ADDRESS}:50056" check inter 2s fall 2 rise 1 on-marked-down shutdown-sessions

listen amqps
    bind :5671
    # Probe the coordinator listener, avoiding repeated TLS handshakes in RabbitMQ.
    server coordinator "${COORDINATOR_ADDRESS}:5671" check port 50053 inter 2s fall 2 rise 1 on-marked-down shutdown-sessions

frontend health
    mode http
    bind :8404
    http-request return status 200 content-type text/plain string "router is running" if { path /health }
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404
