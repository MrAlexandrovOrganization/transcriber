name: Observability package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: make observability-export
      - uses: actions/upload-artifact@v4
        with:
          name: observability-package
          path: .observability/package.tar
          if-no-files-found: error
