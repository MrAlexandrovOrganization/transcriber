name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Serialize releases: a delayed old run must never overwrite the stable marker.
concurrency:
  group: transcriber-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: versions
        run: make ci-versions >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: ${{ steps.versions.outputs.buf }}
          github_token: ${{ github.token }}
      - run: make install-poetry install
      - name: Check against the previous published contract
        run: make check
        env:
          PROTO_BREAKING_AGAINST: .git#ref=${{ github.event.pull_request.base.sha || github.event.before }},subdir=proto
      - name: Start isolated test database
        run: make test-db-up
      - name: Check real PostgreSQL and worker RPCs
        run: make test-integration
        env:
          TRANSCRIBER_TEST_DATABASE_URL: postgresql://pilot:synthetic-ci-password@127.0.0.1:55439/transcriber_pilot
      - name: Stop isolated test database
        if: always()
        run: make test-db-down
      - name: Verify real Caddy TLS and scoped worker RPCs
        run: make test-worker-tls-docker
      - name: Verify real Docker update and rollback
        run: make test-updater-docker
      - name: Build CPU and CUDA images without production credentials
        run: make build-workers

  app-image:
    name: Build and publish backend image
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      manifest: ${{ steps.publish.outputs.manifest }}
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the server image once
        run: make image-build
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the checked image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make image-publish
      - name: Keep the release manifest for rollback
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: transcriber-server-release
          path: .images/release.json
          include-hidden-files: true
          retention-days: 30

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-24.04
    needs: [check, app-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    concurrency:
      group: transcriber-production-deploy
      cancel-in-progress: false

    steps:
      - name: Activate the published server digest
        uses: appleboy/ssh-action@v1
        env:
          PROJECT_PATH: ${{ secrets.VM_PROJECT_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE_MANIFEST_B64: ${{ needs.app-image.outputs.manifest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: PROJECT_PATH,DEPLOY_SHA,IMAGE_MANIFEST_B64,IMAGE_REPOSITORY,GHCR_USER,GHCR_TOKEN
          command_timeout: 35m
          script: |
            set -eu
            cd "${PROJECT_PATH:?}"
            test "$(git rev-parse --show-toplevel)" = "$(pwd -P)"
            git fetch --quiet origin refs/heads/main
            git show "$DEPLOY_SHA:makefiles/ci-deploy.mk" | make -f - ci-deploy

  publish:
    name: Publish ${{ matrix.arch }} worker images
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - id: versions
        run: make ci-versions >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        with:
          version: ${{ steps.versions.outputs.buildx }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make publish-workers PUBLISH_ARCH=${{ matrix.arch }}
        env:
          SOURCE_REVISION: ${{ github.sha }}

  release:
    name: Approve worker release
    needs: [deploy, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - id: versions
        run: make ci-versions >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        with:
          version: ${{ steps.versions.outputs.buildx }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make promote-workers
        env:
          SOURCE_REVISION: ${{ github.sha }}
