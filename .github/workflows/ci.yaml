name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Serialize releases: a delayed old run must never overwrite the stable marker.
concurrency:
  group: transcriber-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: versions
        run: make ci-versions >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ steps.versions.outputs.buf }}
          github_token: ${{ github.token }}
      - run: make install-poetry install
      - name: Check against the previous published contract
        run: make check
        env:
          PROTO_BREAKING_AGAINST: .git#ref=${{ github.event.pull_request.base.sha || github.event.before }},subdir=proto
      - name: Start isolated test database
        run: make test-db-up
      - name: Check real PostgreSQL and worker RPCs
        run: make test-integration
        env:
          TRANSCRIBER_TEST_DATABASE_URL: postgresql://pilot:synthetic-ci-password@127.0.0.1:55439/transcriber_pilot
      - name: Stop isolated test database
        if: always()
        run: make test-db-down
      - name: Verify real Caddy TLS and scoped worker RPCs
        run: make test-worker-tls-docker
      - name: Verify real Docker update and rollback
        run: make test-updater-docker
      - name: Build images
        run: make build
      - name: Build CPU and CUDA images without production credentials
        run: make build-workers

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-24.04
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -eu
            cd ${{ secrets.VM_PROJECT_PATH }}
            test -z "$(git status --porcelain)"
            git fetch origin ${{ github.sha }}
            git merge --ff-only ${{ github.sha }}
            test "$(git rev-parse HEAD)" = '${{ github.sha }}'
            make deploy

  publish:
    name: Publish ${{ matrix.arch }} worker images
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: make ci-versions >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        with:
          version: ${{ steps.versions.outputs.buildx }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make publish-workers PUBLISH_ARCH=${{ matrix.arch }}
        env:
          SOURCE_REVISION: ${{ github.sha }}

  release:
    name: Approve worker release
    needs: [deploy, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: make ci-versions >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        with:
          version: ${{ steps.versions.outputs.buildx }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make promote-workers
        env:
          SOURCE_REVISION: ${{ github.sha }}
