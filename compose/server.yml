# Standalone Whisper transcription service.
# Run independently: make up
#
# Other projects connect by joining the external network "whisper-net":
#
#   networks:
#     whisper-net:
#       external: true
#
# Then set WHISPER_GRPC_HOST=whisper-ingress, WHISPER_GRPC_PORT=50053.

networks:
  whisper-net:
    name: whisper-net
    driver_opts:
      com.docker.network.driver.mtu: "1376"
  jaeger-net:
    external: true
  prometheus-net:
    external: true

services:
  postgres:
    container_name: "${CONTAINER_NAME_PREFIX:-}transcriber-postgres"
    image: postgres:${POSTGRES_VERSION:?Run via make}
    environment:
      POSTGRES_DB: transcriber
      POSTGRES_USER: transcriber
      POSTGRES_PASSWORD: transcriber
    volumes:
      - whisper-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      whisper-net:
        aliases:
          - whisper-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcriber -d transcriber"]
      interval: 10s
      timeout: 5s
      retries: 10

    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.1"

  whisper-ingress:
    container_name: "${CONTAINER_NAME_PREFIX:-}transcriber-ingress"
    build:
      context: .
      dockerfile: whisper/Dockerfile
      target: runtime
      args: &build-args
        PYTHON_VERSION: ${PYTHON_VERSION:?Run via make}
        POETRY_VERSION: ${POETRY_VERSION:?Run via make}
        GRPCIO_TOOLS_VERSION: ${GRPCIO_TOOLS_VERSION:?Run via make}
    environment:
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-268435456}
      MAX_JOB_STORAGE_BYTES: ${MAX_JOB_STORAGE_BYTES:-8589934592}
      MIN_JOB_STORAGE_FREE_BYTES: ${MIN_JOB_STORAGE_FREE_BYTES:-1073741824}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-4}
      GRPC_PORT: 50053
      GRPC_WORKERS: 4
      GRPC_MAX_MESSAGE_BYTES: 52428800
      SERVICE_ROLE: ingress
      DATABASE_URL: postgresql://transcriber:transcriber@whisper-postgres:5432/transcriber
      JOB_STORAGE_DIR: /data/jobs
      JOB_MAX_ATTEMPTS: 3
      JOB_LEASE_SECONDS: 120
      PREFERRED_WORKER_IDS: ${PREFERRED_WORKER_IDS:-mac-m3-pro,wsl-gpu,wsl-cpu}
      WORKER_POLICIES: ${WORKER_POLICIES:-}
      WORKER_DEMAND_TTL_S: ${WORKER_DEMAND_TTL_S:-10}
      WORKER_AVAILABILITY_TTL_S: ${WORKER_AVAILABILITY_TTL_S:-90}
      JOB_TTL_S: 7200
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      METRICS_ADDRESS: transcriber-metrics:9108
      FALLBACK_WORKER_ID: server-fallback
    volumes:
      - whisper-job-data:/data/jobs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      whisper-net: {}
      jaeger-net: {}
      prometheus-net:
        aliases: [transcriber-metrics]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import grpc
          ch = grpc.insecure_channel('localhost:50053')
          grpc.channel_ready_future(ch).result(timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.1"

  whisper-worker:
    profiles: [fallback]
    container_name: "${CONTAINER_NAME_PREFIX:-}transcriber-worker"
    build:
      context: .
      dockerfile: whisper/Dockerfile
      target: runtime
      args: *build-args
    environment:
      SERVICE_ROLE: worker
      DATABASE_URL: postgresql://transcriber:transcriber@whisper-postgres:5432/transcriber
      JOB_STORAGE_DIR: /data/jobs
      JOB_MAX_ATTEMPTS: 3
      JOB_LEASE_SECONDS: 120
      PREFERRED_WORKER_IDS: ${PREFERRED_WORKER_IDS:-mac-m3-pro,wsl-gpu,wsl-cpu}
      WORKER_POLICIES: ${WORKER_POLICIES:-}
      WORKER_DEMAND_TTL_S: ${WORKER_DEMAND_TTL_S:-10}
      WORKER_AVAILABILITY_TTL_S: ${WORKER_AVAILABILITY_TTL_S:-90}
      WORKER_ID: server-fallback
      WORKER_CONCURRENCY: ${SERVER_WORKER_CONCURRENCY:-1}
      WORKER_FALLBACK: ${WORKER_FALLBACK:-1}
      JOB_TTL_S: 7200
      CLEANUP_INTERVAL_S: 600
      WORKER_POLL_INTERVAL_S: 2
      WHISPER_MODEL: ${SERVER_WORKER_MODEL:-large}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: ${SERVER_WORKER_COMPUTE_TYPE:-int8}
      WHISPER_CPU_THREADS: ${SERVER_WORKER_CPU_THREADS:-8}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      - whisper-model-cache:/root/.cache/huggingface
      - whisper-job-data:/data/jobs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whisper-net
      - jaeger-net

    deploy:
      resources:
        limits:
          memory: ${SERVER_WORKER_MEMORY_LIMIT:-4.0g}
          cpus: ${SERVER_WORKER_CPU_LIMIT:-8.0}
        reservations:
          memory: 2g

volumes:
  whisper-model-cache:
  whisper-job-data:
  whisper-postgres-data:
