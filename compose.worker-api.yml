# Opt in only after provisioning the token file. Host access stays loopback-only.
# The normal Compose deployment remains usable by existing local workers/clients.
services:
  whisper-ingress:
    environment:
      WORKER_GRPC_ADDR: "[::]:50055"
      WORKER_TOKEN_FILE: /run/secrets/remote-worker-token
    ports:
      - "127.0.0.1:50055:50055"
    secrets:
      - remote-worker-token

secrets:
  remote-worker-token:
    file: ${WORKER_TOKEN_PATH:?Set WORKER_TOKEN_PATH to the protected token file}
